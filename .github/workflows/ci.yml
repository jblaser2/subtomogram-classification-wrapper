name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[dev,viz]"

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Mypy (core modules)
        run: mypy src/stw/spec.py src/stw/config.py src/stw/masks src/stw/averaging.py src/stw/compare
        continue-on-error: true  # advisory for now — not every adapter module is typed yet

      - name: Regenerate the tiny fixture
        run: python tests/fixtures/make_fixture.py

      - name: Pytest (unit + integration + adapter contract tests)
        run: pytest -q --ignore=tests/native

      - name: CLI smoke test
        run: |
          stw --help
          stw list
          stw check-env
