name: stw-disca
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy<2
  - scipy
  - scikit-learn
  - mrcfile
  - tqdm
  - pip
  - pip:
      # CUDA build matching this machine's driver; swap the index URL for a
      # different CUDA version or the CPU-only wheel if no GPU is present
      # (real training is impractically slow on CPU beyond a tiny fixture).
      - --index-url https://download.pytorch.org/whl/cu128
      - torch
      - torchvision
