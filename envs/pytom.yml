  - "numpy<2"
  - scipy
  - matplotlib
  - mrcfile
  - tqdm
  - boost
  - fftw[build=*openmpi*]
  - numba
  - lxml
  - openmpi
  - openmpi-mpicc
  - openmpi-mpicxx
  - openmpi-mpifort
  - mpi4py
  - swig
  - scikit-image
